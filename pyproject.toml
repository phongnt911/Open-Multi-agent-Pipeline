[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omp-orchestrator"
version = "0.1.0"
description = "Sequential local coding pipeline with recoverable checkpoints"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
omp = "omp_core.main:main"

[tool.setuptools.packages.find]
include = ["omp_core*"]
